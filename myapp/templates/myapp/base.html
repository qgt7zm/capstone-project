<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Eric Weng">
    <meta name="description" content="{% block description %}{% endblock %}">
    <meta name="keywords" content="gamification,game element,design">
    <title>{% block title %}{% endblock %}</title>

    <!--Bootstrap CSS-->
    {% load django_bootstrap5 %}
    {% bootstrap_css %}

    <!--Static CSS-->
    {% load static %}
    <link href="{% static 'myapp/styles/main.css' %}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-md bg-body-tertiary-custom">
    <div class="container px-5 py-3">
        <a class="navbar-brand" href="{% url 'myapp:home' %}">Home</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!--Navbar Links-->
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myapp:elements' %}">Elements</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myapp:outcomes' %}">Outcomes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myapp:resources' %}">Resources</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myapp:scenarios' %}">Scenarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myapp:data' %}">Data</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myapp:about' %}">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container px-5 py-4">
    {% block main %}{% endblock %}
</main>

<footer class="footer navbar navbar-expand bg-body-tertiary-custom">
    <div class="container px-5 py-3 justify-content-center">
        <ul class="navbar-nav">
            <li class="nav-item px-3 py-2">
                <span class="text-secondary-custom">&copy; 2026 Eric Weng</span>
            </li>
            <li class="nav-item px-3 py-2">
                <a class="link-secondary-custom" href="https://github.com/qgt7zm/capstone-project">View Source</a>
            </li>
        </ul>
    </div>
</footer>

<!--Bootstrap JS-->
{% bootstrap_javascript %}
</body>
</html>
